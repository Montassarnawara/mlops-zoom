version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pg_container
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
